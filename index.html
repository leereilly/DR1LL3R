<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>UNICORN HORN DRILL</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden;touch-action:none;overscroll-behavior:none}
  canvas{display:block;image-rendering:auto}
</style>
</head>
<body>
<canvas id="c" aria-label="Unicorn Horn Drill. Arrow keys, A and D, or drag to steer. M to mute."></canvas>
<!-- Dev-only guard: classic script runs even when the ES module below is
     blocked by the browser's file:// origin policy. It replaces the black
     screen with instructions. This shell is never used for the release; the
     self-contained dist/index.html is generated separately by build.mjs. -->
<script>
  if (location.protocol === "file:") {
    document.body.innerHTML =
      '<div style="position:fixed;inset:0;display:flex;align-items:center;' +
      'justify-content:center;padding:1.5rem;box-sizing:border-box;' +
      'font:16px/1.5 system-ui,sans-serif;color:#e8e9f3;text-align:center">' +
      '<div style="max-width:34rem">' +
      '<h1 style="margin:0 0 .5rem;font-size:1.4rem">UNICORN HORN DRILL</h1>' +
      '<p style="margin:0 0 1rem">This dev page loads ES modules, which browsers ' +
      "block over <code>file://</code>. Run a local server instead:</p>" +
      '<pre style="margin:0 auto 1rem;display:inline-block;text-align:left;' +
      'background:#0d1030;padding:.75rem 1rem;border-radius:.5rem;color:#a9f">' +
      "npm ci\nnpm start</pre>" +
      '<p style="margin:0">Then open ' +
      '<a href="http://127.0.0.1:8080/" style="color:#8cf">http://127.0.0.1:8080/</a>.' +
      "<br>Or extract the release ZIP and open its <code>index.html</code> directly.</p>" +
      "</div></div>";
  }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
